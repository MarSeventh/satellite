name: Verify desktop build

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Build desktop app
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Verify native circular region at multiple pixel sizes
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --release --lib floating::tests --target ${{ matrix.target }}
      - name: Check the running Windows floating window
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-floating-window.ps1 -Executable ./src-tauri/target/${{ matrix.target }}/release/satellite.exe
      - name: Upload preview installers
        uses: actions/upload-artifact@v4
        with:
          name: satellite-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
